<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tzared Engine - HTML5 School Project</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0905;
            color: #ebdcb9;
            font-family: 'Verdana', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #top-bar {
            height: 35px;
            background: #26190e;
            border-bottom: 2px solid #6e461a;
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .res { color: #ffcc00; }
        canvas {
            display: block;
            background: #735a3f;
            cursor: default;
        }
        /* Panel inferior simulando la interfaz real de Tzared */
        #control-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 120px;
            background: #1c120a;
            border-top: 3px solid #6e461a;
            display: flex;
            padding: 10px;
            box-sizing: border-box;
        }
        .panel-section {
            border: 1px solid #47301b;
            height: 100%;
            padding: 5px;
            background: #120b06;
            margin-right: 10px;
        }
        #minimap { width: 100px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #555; background: #000; }
        #actions { flex-grow: 1; }
        .action-btn {
            background: #4a1515;
            color: #fff;
            border: 1px solid #913131;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .action-btn:hover { background: #732222; }
        .exit-btn { background: #444; color: #fff; text-decoration: none; padding: 2px 8px; font-size: 0.8rem; border-radius: 3px; }
    </style>
</head>
<body>

    <!-- Recursos de Tzar -->
    <div id="top-bar">
        <a href="index.html" class="exit-btn">❌ Salir</a>
        <div>Motor: <span style="color:#ff5500;">Tzared Web v1.0</span></div>
        <div class="res">🪵 Madera: <span id="w-val">500</span></div>
        <div class="res">🥩 Alimento: <span id="f-val">600</span></div>
        <div class="res">🪙 Oro: <span id="g-val">400</span></div>
        <div>Población: <span id="p-val">1</span></div>
    </div>

    <!-- El lienzo del mapa -->
    <canvas id="tzaredCanvas"></canvas>

    <!-- Panel de control inferior -->
    <div id="control-panel">
        <div id="minimap" class="panel-section">📦 MINIMAPA</div>
        <div id="actions" class="panel-section">
            <h4 style="margin:0 0 8px 0; font-size:0.8rem; color:#ffd700;">Acciones del Centro Urbano</h4>
            <button class="action-btn" onclick="crearAldeano()">Entrenar Aldeano (50 Alimento)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tzaredCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 155; // Deja espacio para barras superior e inferior
        }
        resize();
        window.addEventListener('resize', resize);

        // Variables del juego
        let alimentos = 600;
        let poblacion = 1;
        
        // Simulación de cuadrícula de Tzared (Cargar coordenadas de edificios estáticos)
        let edificios = [
            {x: 150, y: 150, tipo: "Centro Urbano", color: "#4a4a4a", w: 80, h: 80},
            {x: 400, y: 100, tipo: "Castillo Keanor", color: "#8a1a1a", w: 100, h: 100}
        ];

        let aldeanos = [
            {x: 270, y: 190, targetX: 270, targetY: 190, seleccionado: false}
        ];

        // Lógica del entrenamiento de unidades
        function crearAldeano() {
            if (alimentos >= 50) {
                alimentos -= 50;
                poblacion += 1;
                document.getElementById('f-val').innerText = alimentos;
                document.getElementById('p-val').innerText = poblacion;
                // Aparece cerca del Centro Urbano
                aldeanos.push({x: 190, y: 250, targetX: 190, targetY: 250, seleccionado: false});
            } else {
                alert("¡Falta Alimento! Cosecha más.");
            }
        }

        // Detectar clicks para mover unidades (Click izquierdo selecciona/mueve en este prototipo rápido)
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Ordenar movimiento al primer aldeano
            aldeanos[0].targetX = clickX;
            aldeanos[0].targetY = clickY;
        });

        // Bucle del Motor Gráfico
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar el mapa base de tierra
            ctx.fillStyle = "#806443";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Dibujar Edificios
            edificios.forEach(ed => {
                ctx.fillStyle = ed.color;
                ctx.fillRect(ed.x, ed.y, ed.w, ed.h);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(ed.x, ed.y, ed.w, ed.h);
                ctx.fillStyle = "#fff";
                ctx.font = "10px sans-serif";
                ctx.fillText(ed.tipo, ed.x + 5, ed.y + 20);
            });

            // 3. Actualizar y Dibujar Aldeanos
            aldeanos.forEach(ald => {
                // Suave movimiento hacia el objetivo clicado
                let dx = ald.targetX - ald.x;
                let dy = ald.targetY - ald.y;
                if (Math.abs(dx) > 2) ald.x += Math.sign(dx) * 2;
                if (Math.abs(dy) > 2) ald.y += Math.sign(dy) * 2;

                // Dibujar el Sprite del aldeano (Círculo azul con escudo dorado de Tzar)
                ctx.beginPath();
                ctx.arc(ald.x, ald.y, 10, 0, Math.PI * 2);
                ctx.fillStyle = "#1e63b3";
                ctx.fill();
                ctx.strokeStyle = "#ffd700";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();
            });

            requestAnimationFrame(render);
        }

        // Iniciar ejecutor gráfico
        render();
    </script>
</body>
</html>
